name: Build JISAN MOBILE APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore and env fallback
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build JISAN MOBILE Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package APK binary
        run: cp app/build/outputs/apk/debug/app-debug.apk JISAN-MOBILE.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JISAN-MOBILE-APK
          path: JISAN-MOBILE.apk

      - name: Publish direct APK download on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest JISAN-MOBILE.apk --clobber
          else
            gh release create latest JISAN-MOBILE.apk \
              --target "${{ github.sha }}" \
              --title "JISAN MOBILE APK (Latest Build)" \
              --notes "Direct installable Android APK built automatically from JISAN MOBILE source."
          fi
