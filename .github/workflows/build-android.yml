name: Build JISAN MOBILE APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install clean Android SDK Command Line Tools (avoid preinstalled sdkmanager conflict)
        run: |
          ANDROID_SDK="$HOME/android-sdk"
          rm -rf "$ANDROID_SDK"
          mkdir -p "$ANDROID_SDK/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
          mv /tmp/cmdline-extract/cmdline-tools "$ANDROID_SDK/cmdline-tools/latest"
          rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-extract

          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses and install Platform 36, Build Tools 36.0.0, and Platform Tools
        run: |
          set +o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platforms;android-36.1"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore and environment fallback
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json is missing!"
            exit 1
          fi

      - name: Build JISAN MOBILE APK
        env:
          CI_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          CI_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          CI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$CI_KEYSTORE_B64" ] && [ -n "$CI_STORE_PASSWORD" ] && [ -n "$CI_KEY_PASSWORD" ]; then
            echo "$CI_KEYSTORE_B64" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            export STORE_PASSWORD="$CI_STORE_PASSWORD"
            export KEY_PASSWORD="$CI_KEY_PASSWORD"
            gradle :app:assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            cp app/build/outputs/apk/release/app-release.apk JISAN-MOBILE.apk
          else
            gradle :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            cp app/build/outputs/apk/debug/app-debug.apk JISAN-MOBILE.apk
          fi

      - name: Verify APK integrity and signature
        run: |
          test -s JISAN-MOBILE.apk
          unzip -tqq JISAN-MOBILE.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose JISAN-MOBILE.apk
          fi
          ls -lh JISAN-MOBILE.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JISAN-MOBILE-APK
          path: JISAN-MOBILE.apk
          retention-days: 90

      - name: Publish JISAN-MOBILE.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "JISAN MOBILE APK (Latest Build)"
          body: |
            Automated Android APK build for **JISAN MOBILE** (`com.aistudio.jisanmobile.xkwpqr`).
            Tap `JISAN-MOBILE.apk` below to download and install directly on Android 7.0+.
          files: JISAN-MOBILE.apk
          make_latest: true
          fail_on_unmatched_files: true
